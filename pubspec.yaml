name: novo_historians
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  cloud_firestore: ^5.6.0
  fl_chart: ^0.70.0
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_svg: ^2.0.16
  flip_card: ^0.7.0
  flutter_markdown: ^0.7.4+3
  lottie: ^3.3.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  rxdart: ^0.28.0
  shared_preferences: ^2.3.4
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.0
  audioplayers: ^6.1.0
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/avatars/
    - assets/sounds/
    - assets/images/ic_launcher_adaptive_back.png
    - assets/images/ic_launcher_adaptive_fore.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
